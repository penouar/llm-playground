[project]
name = "llm-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Amine Menouer", email = "m.menouer@aui.ma" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.57.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llm-playground = "llm_playground:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
